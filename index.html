<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>홈페이지</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
      }

      p {
        margin: 0;
      }
    </style>

  <body>
    <main>
      <h1>환영합니다</h1>
      <p>기본적인 홈 페이지입니다.</p>
      <p>이 페이지는 간단한 프로젝트 소개용 시작 화면으로 사용할 수 있습니다.</p>
    </main>
  </body>
</html>
